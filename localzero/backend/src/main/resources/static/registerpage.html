<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Local Zero</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Welcome to Local Zero!</h1>
<div class="register-box">


    <label class="input-label" for="register-name">Name</label>
    <input class="input-field" type="text" id="register-name" name="Name">

    <label class="input-label" for="register-email">E-mail</label>
    <input class="input-field" type="text" id="register-email" name="E-mail">

    <label class="input-label" for="register-location">Location</label>
    <input class="input-field" type="text" id="register-location" name="Location">

    <label class="input-label" for="register-username">Username</label>
    <input class="input-field" type="text" id="register-username" name="Username">

    <label class="input-label" for="register-password">Password</label>
    <input class="input-field" type="text" id="register-password" name="Password">

    <button class="reg-page-register-button" id="register-button">Register</button>
</div>
<script src="app.js"></script>
</body>
