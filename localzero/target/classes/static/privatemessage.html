<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
  <link rel="stylesheet" href="css/privatemessage.css">
  <title>Title</title>
</head>
<body class="message-body">

<div class="layout">
<aside class="sidebar left">
    <h2 class="sidebar-title">Friends</h2>

    <div class="sidebar-card">
        <button class="btn-primary" id="visit-resident-profile">
            View resident profile
        </button>
    </div>
    <a class="btn" href="frontpage.html">Back to feed</a>

</aside>

<div class="chat-container">

    <div class="chat-header">
        <h2>Messages</h2>
    </div>

    <div class="chat-box">
        <div class="message received">Message</div>
        <div class="message sent">Message</div>
        <div class="message received">Message</div>
    </div>

    <div class="chat-input-area">
        <input id="messageInput" type="text" placeholder="Write a message...">
        <button id="sendButton">Send</button>
    </div>

</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs/lib/stomp.min.js"></script>
<script src="js/privatemessage.js"></script>
</body>
</html>
