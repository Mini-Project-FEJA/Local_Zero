<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Local Zero</title>
    <link rel="stylesheet" href="frontpage.css">
</head>

<body>

<div class="layout">

    <aside class="sidebar left">
        <h2 class="sidebar-title">Your Community</h2>

        <div class="sidebar-card">
            <button class="btn-primary" id="visit-resident-profile">
                View resident profile
            </button>
        </div>
    </aside>

    <main class="feed">

        <div class="feed-header">
            <h1>For You</h1>
            <p>Initiatives from your community</p>
        </div>

        <div class="post-card">
            <h3>Initiative </h3>
            <p>Initiative description</p>
        </div>

        <div class="post-card">
            <h3>Initiative </h3>
            <p>Initiative description</p>
        </div>

        <div>
            <button class="btn-primary" id="new-initiative-button">New initiative</button>
        </div>

        <div class="popup-box visible" id="initiative-popup">
            <h2>Create new initiative</h2>
            <h3>Title:<input class="initiative-input" id="initiative-title" type="text" placeholder="E.g disco i Trelleborg"></h3>
            <h3>Event begins:
                <input class="initiative-input" id="initiative-start" type="datetime-local">
            <h3>Event ends:
                <input class="initiative-input" id="initiative-end" type="datetime-local">
            <h3>Category:
                <select class="initiative-input" id="initiative-category">
                    <option value="music">Music</option>
                    <option value="sport">Sport</option>
                </select>
            </h3>
            <h3>Location:<input class="initiative-input" id="initiative-location" type="text"></h3>
            <h3>Visibility
                <select class="initiative-input initiative-visibility" id="initiative-visibility" required>
                    <option value="public">Public</option>
                    <option value="private">Private</option>
                    <option value="residents_only">Residents only</option>
                </select>
            </h3>
            <label for="initiative-description-field">Description:</label>
            <br/>
            <textarea rows="5" id="initiative-description-field" placeholder="Describe your event"></textarea>
            <br/>
            <button class="btn-primary" id="create-initiative-button">Create</button>


        </div>

    </main>

    <aside class="sidebar right">
        <h2 class="sidebar-title">Notifications</h2>

        <div class="sidebar-card">
            <p>No new notifications</p>
        </div>
    </aside>

</div>

<script src="/frontpage.js"></script>
</body>
</html>
