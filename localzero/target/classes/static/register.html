<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Local Zero</title>
    <link rel="stylesheet" href="css/register.css">
</head>

<body>

<h1>Welcome to Local Zero!</h1>
<div class="register-box">
    <h4>Register</h4>
    <input class="login-input" id="register-name" type="text" placeholder="Name">
    <input class="login-input" id="register-email" type="text" placeholder="E-mail">
    <input class="login-input" id="register-location" type="text" placeholder="Location">
    <input class="login-input" id="register-username" type="text" placeholder="Username">
    <input class="login-input" id="register-password" type="password" placeholder="Password">
    <button class="reg-page-register-button" id="register-button">Register</button>
</div>
<script src="/js/register.js"></script>
</body>
