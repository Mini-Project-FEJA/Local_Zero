<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Initiatives</title>
    <link rel="stylesheet" href="css/initiative.css">
    <link rel="stylesheet" href="css/popup.css">
    <link rel="stylesheet" href="css/layout.css">

</head>
<body>

    <div class="layout">

        <aside class="sidebar left" id="left-sidebar"></aside>

        <main class="feed">
            <div class="feed-header" id="initiatives-header">
                <h1>My initiatives</h1>
                <button class="btn-primary new-initiative-button" id="new-initiative-button">New initiative</button>
            </div>
            <div class="initiative-container" id="my-initiatives-container"></div>
            <hr class="line-divider">

            <h1>All initiatives</h1>
            <div class="initiative-container" id="all-initiatives-container"></div>

            <div class="popup-box visible" id="initiative-popup"></div>
        </main>

        <aside class="sidebar right" id="right-sidebar"></aside>

    </div>

    <script src="/js/initiatives.js" type="module"></script>

</body>
</html>
