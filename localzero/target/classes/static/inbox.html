<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Inbox</title>

    <link rel="stylesheet" href="css/inbox.css">
    <link rel="stylesheet" href="css/layout.css">
</head>

<body>

<div class="layout">

    <aside class="sidebar left" id="left-sidebar"></aside>

    <main class="feed">

        <div class="feed-header">
            <h1>Inbox</h1>
        </div>

        <div class="message-box">

            <div class="new-message-container">

                <button id="new-message-btn">
                    + New Message
                </button>

                <div class="resident-menu" id="resident-menu">

                </div>

            </div>

            <div id="messages-list"></div>

        </div>

    </main>

    <aside class="sidebar right" id="right-sidebar"></aside>

</div>

<script src="/js/inbox.js" type="module"></script>

</body>
</html>
