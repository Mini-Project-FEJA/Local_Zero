<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Inbox</title>
    <link rel="stylesheet" href="css/inbox.css">

</head>
<body>
<h1>Inbox</h1>
<div class="message-box">
    <button class="btn-primary" id="new-message">New message</button>
    <div id="messages-list"></div>
</div>

<div id="new-message-popup" class="popup" style="display: none;">
    <div class="popup-content">
        <span id="close-popup" class="close">&times;</span>
        <h2>Send a message</h2>
        <form id="message-form">
            <label for="message-content"></label>
            <textarea id="message-content" rows="4" placeholder="Type your message here..."></textarea>
            <button type="submit" id="send-message">Send</button>
        </form>
    </div>
</div>

<script src="/js/inbox.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
